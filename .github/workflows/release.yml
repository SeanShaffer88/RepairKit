name: 'Release'

permissions:
  contents: write

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    name: 'Build and Publish Release'
    runs-on: windows-latest

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4

      - name: 'Build Launcher and Release ZIP'
        run: .\gradlew.bat release --stacktrace

      - name: 'Create GitHub Release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $zip = Get-ChildItem 'build/dist' -Filter "RepairKit-$version.zip"

          if (-not $zip) {
            throw "Expected build/dist/RepairKit-$version.zip"
          }

          gh release create '${{ github.ref_name }}' `
            $zip.FullName `
            'build/dist/SHA256SUMS.txt' `
            --title "RepairKit $version" `
            --generate-notes
