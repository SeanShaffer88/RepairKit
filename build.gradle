plugins {
    id 'com.gradleup.shadow' version '9.4.1'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id 'java'
    id 'application'
}

group = 'net.foulest'
version = '1.4.1'
description = 'RepairKit - an all-in-one Windows repair and maintenance toolkit'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'net.foulest.repairkit.RepairKit'
}

repositories {
    mavenCentral()
}

dependencies {
    // JNA and JNA Platform - registry, token, and shell access
    // https://mvnrepository.com/artifact/net.java.dev.jna/jna-platform
    implementation 'net.java.dev.jna:jna-platform:5.19.1'

    // Google Gson - release metadata
    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // two-slices - WinGet progress notifications
    // https://github.com/sshtools/two-slices
    implementation 'com.sshtools:two-slices:0.9.7'

    // JetBrains Annotations - nullability documentation for static analysis
    compileOnly 'org.jetbrains:annotations:26.1.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

// Byte-for-byte reproducible archives: no timestamps, stable file order.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    // The build version is substituted into the packaged version.properties.
    filesMatching('version.properties') {
        expand(version: project.version)
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// The plain jar stays dependency-free; the shadow jar is the runnable artifact.
shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

jar {
    archiveClassifier = 'thin'
}

launch4j {
    outfile = "RepairKit-${project.version}.exe"
    jarTask = tasks.shadowJar
    mainClassName = 'net.foulest.repairkit.RepairKit'

    // The bundled runtime is Java 17: never start with an older JRE.
    jreMinVersion = '17.0.0'
    bundledJrePath = 'jre'
    requires64Bit = true
    initialHeapSize = 128
    maxHeapSize = 1024

    // A native mutex prevents a second elevated instance from starting.
    mutexName = 'RepairKit'

    icon = file('src/main/resources/icons/RepairKit.ico').absolutePath
    manifest = file('RepairKit.manifest').absolutePath
    version = project.version
    textVersion = project.version
    fileDescription = 'RepairKit'
    productName = 'RepairKit'
    internalName = 'RepairKit'
    copyright = 'Copyright (C) 2026 Foulest'
}

def buildDirectory = layout.buildDirectory.get().asFile

tasks.register('signExecutable') {
    group = 'distribution'
    description = 'Signs the launcher when REPAIRKIT_SIGNTOOL and REPAIRKIT_CERT_SHA1 are set.'
    dependsOn createExe

    doLast {
        String signtool = System.getenv('REPAIRKIT_SIGNTOOL')
        String certificate = System.getenv('REPAIRKIT_CERT_SHA1')
        File exe = new File(buildDirectory, "launch4j/RepairKit-${project.version}.exe")

        if (signtool == null || certificate == null) {
            logger.lifecycle('Code signing skipped: REPAIRKIT_SIGNTOOL and REPAIRKIT_CERT_SHA1 are not set.')
            return
        }

        if (!exe.isFile()) {
            throw new GradleException("The launcher was not created: ${exe}")
        }

        exec {
            commandLine signtool, 'sign', '/sha1', certificate, '/fd', 'sha256',
                    '/tr', 'http://timestamp.digicert.com', '/td', 'sha256', exe.absolutePath
        }
    }
}

tasks.register('stageDistribution', Copy) {
    group = 'distribution'
    description = 'Stages the executable, bundled runtime, and default configuration.'
    dependsOn signExecutable

    from(new File(buildDirectory, 'launch4j')) {
        include '*.exe'
    }
    from('jre') {
        into 'jre'
    }
    from('src/main/resources/config') {
        into 'config'
    }
    into new File(buildDirectory, "dist/RepairKit-${project.version}")
}

tasks.register('checksums') {
    group = 'distribution'
    description = 'Writes SHA-256 checksums for the release archive and launcher.'
    dependsOn zipDistribution

    doLast {
        File dist = new File(buildDirectory, 'dist')
        File output = new File(dist, 'SHA256SUMS.txt')
        StringBuilder text = new StringBuilder()

        dist.eachFileRecurse { File entry ->
            if (entry.isFile() && entry.name != 'SHA256SUMS.txt'
                    && (entry.name.endsWith('.exe') || entry.name.endsWith('.zip'))) {
                text.append(sha256(entry)).append('  ').append(entry.name).append('\n')
            }
        }

        output.text = text.toString()
        logger.lifecycle("Checksums written to ${output}")
    }
}

tasks.register('zipDistribution', Zip) {
    group = 'distribution'
    description = 'Packages the staged distribution into a release ZIP.'
    dependsOn stageDistribution

    from new File(buildDirectory, "dist/RepairKit-${project.version}")
    archiveFileName = "RepairKit-${project.version}.zip"
    destinationDirectory = new File(buildDirectory, 'dist')
}

tasks.register('release') {
    group = 'distribution'
    description = 'Builds and validates the complete Windows release.'
    dependsOn checksums
}

static String sha256(File file) {
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[64 * 1024]
        int read

        while ((read = stream.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().encodeHex().toString()
}
